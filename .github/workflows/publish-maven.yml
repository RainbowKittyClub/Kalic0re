name: Publish Maven package

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Resolve release and Java versions
        run: |
          release_version="${GITHUB_REF_NAME#v}"
          mod_version="$(sed -nE 's/^[[:space:]]*mod_version[[:space:]]*=[[:space:]]*(.+)[[:space:]]*$/\1/p' gradle.properties | head -n1)"
          if [ -z "$mod_version" ]; then
            echo "Could not resolve mod_version from gradle.properties" >&2
            exit 1
          fi
          if [ "$release_version" != "$mod_version" ]; then
            echo "Version mismatch between tag and mod_version" >&2
            echo "Tag: ${GITHUB_REF_NAME}" >&2
            echo "mod_version: ${mod_version}" >&2
            exit 1
          fi
          echo "RELEASE_VERSION=${mod_version}" >> "$GITHUB_ENV"
          java_version="$(grep '^java_version=' gradle.properties | head -n1 | cut -d'=' -f2 | tr -d '[:space:]')"
          if [ -z "$java_version" ]; then
            echo "Could not resolve java_version from gradle.properties" >&2
            exit 1
          fi
          echo "JAVA_VERSION=${java_version}" >> "$GITHUB_ENV"

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          cache: gradle

      - name: Publish package
        run: ./gradlew --no-daemon publish -Pmod_version="${RELEASE_VERSION}"
        env:
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
