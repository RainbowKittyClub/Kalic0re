// kalic0re-specific build logic. Applied last by the shared gradle/build.gradle.

// The claim mods common/claim's probes call. compileOnly and non-transitive: each probe class is
// loaded only when its mod is, and a consumer relocates common/claim in without any of these.
// Modrinth and nucleoid are already repositories of the shared build; FTB publishes to its own.
// FTB Chunks has no 26.2 build yet, so its probe compiles against 26.1.2's API and disables
// itself if that has moved.
repositories {
	maven {
		name = 'FTB'
		url = 'https://maven.ftb.dev/releases'
	}
}

dependencies {
	compileOnly('maven.modrinth:goml-reserved:1.21.0+26.2') { transitive = false }
	compileOnly('maven.modrinth:flan:26.2-1.12.8-fabric') { transitive = false }
	compileOnly('maven.modrinth:open-parties-and-claims:fabric-26.2-0.31.6') { transitive = false }
	compileOnly('dev.ftb.mods:ftb-chunks-fabric:26.1.2.8') { transitive = false }
	compileOnly('dev.ftb.mods:ftb-teams-fabric:26.1.2.4') { transitive = false }
	compileOnly('eu.pb4:common-protection-api:2.0.0') { transitive = false }
}

// A <name>.json among a pack's functions is a dialog (or a piece of one), built into <name>.mcfunction:
// a function that stores it in storage <namespace>:dialog at built.<name>. A $(key) naming one of its
// own inputs is left for the client; any other $(arg) is filled from <namespace>:dialog args. The JSON
// source stays out of the pack; keys named "//" are comments and are dropped.
def dialogSources = fileTree('src/main/resources/resourcepacks') { include '*/data/*/function/**/*.json' }
def dialogFunctions = layout.buildDirectory.dir('generated/datapackDialogs')
def generateDatapackDialogs = tasks.register('generateDatapackDialogs') {
	description = 'Builds each dialog .json among the built-in packs\' functions into its .mcfunction.'
	inputs.files(dialogSources)
	outputs.dir(dialogFunctions)
	doLast {
		def out = dialogFunctions.get().asFile
		project.delete(out)
		// SNBT reads JSON as is; unescaped, text like "…" also stays readable in the generated function.
		def json = new groovy.json.JsonGenerator.Options().disableUnicodeEscaping().build()
		def dropComments
		dropComments = { node ->
			node instanceof Map ? node.findAll { k, v -> k != '//' }.collectEntries { k, v -> [k, dropComments(v)] }
				: node instanceof List ? node.collect(dropComments) : node
		}
		dialogSources.visit { source ->
			if (source.directory) return
			def dialog = dropComments(new groovy.json.JsonSlurper().parse(source.file, 'UTF-8'))
			def text = json.toJson(dialog)
			def segments = source.relativePath.segments // <pack>/data/<namespace>/function/<path>.json
			def namespace = segments[2]
			def name = source.name.replaceAll(/\.json$/, '')
			def function = "${namespace}:${segments[4..-1].join('/').replaceAll(/\.json$/, '')}"
			def store = "data modify storage ${namespace}:dialog built.${name} set value ${text}\n"
			def header = "# Generated from ${source.name}; edit that instead.\n"
			def base = source.relativePath.pathString.replaceAll(/\.json$/, '')
			def write = { String path, String content ->
				def target = new File(out, path)
				target.parentFile.mkdirs()
				target.setText(content, 'UTF-8')
			}
			def inputs = dialog instanceof Map && dialog.inputs instanceof List ? dialog.inputs*.key as Set : [] as Set
			def placeholders = (text =~ /\$\(([A-Za-z0-9_]+)\)/).collect { it[1] } as Set
			def args = placeholders - inputs
			if (args.isEmpty()) {
				write("${base}.mcfunction", header + store)
				return
			}
			// A macro line would fill the inputs' $(key) too, so each goes in as an argument holding itself.
			def keep = (placeholders - args).collect { "data modify storage ${namespace}:dialog args.${it} set value \"\$(${it})\"\n" }
			write("${base}.mcfunction", header.replace('instead.', "instead. Reads ${args.collect { "\$(${it})" }.join(', ')} from ${namespace}:dialog args.")
				+ keep.join('') + "function ${function}.macro with storage ${namespace}:dialog args\n")
			write("${base}.macro.mcfunction", header + '$' + store)
		}
	}
}
tasks.named('processResources') {
	exclude 'resourcepacks/*/data/*/function/**/*.json'
	from(generateDatapackDialogs) { into 'resourcepacks' }
}

// A pack's English is written once, in its lang/en_us.json: each {translate:"<key>"} of the pack's own
// keys gets the text there as its fallback, SNBT or JSON alike, for clients without its resource pack.
// A key missing from the file, a fallback written in a source, or a key built at run time fails the build.
def packLangs = fileTree('src/main/resources/resourcepacks') { include '*/lang/en_us.json' }
def usedEnglish = Collections.synchronizedSet(new HashSet<String>())
def englishOf = [:].withDefault { String pack ->
	def lang = file("src/main/resources/resourcepacks/${pack}/lang/en_us.json")
	def english = lang.exists() ? new groovy.json.JsonSlurper().parse(lang, 'UTF-8') as Map : [:]
	// A macro line would expand $( in the text.
	english.each { key, text ->
		if (text.contains('$(')) throw new GradleException("${lang}: ${key}'s English holds \$(, which a macro line would expand")
	}
	english
}
// A JSON string is an SNBT one too, escapes and all; a raw line break would end the function's line.
def quoted = new groovy.json.JsonGenerator.Options().disableUnicodeEscaping().build()
def withFallbacks = { String line, Map english, String where ->
	if (line =~ /(?<![A-Za-z])"?fallback"?\s*:/) {
		throw new GradleException("${where}: fallback text belongs in lang/en_us.json, not here: ${line.trim()}")
	}
	line.replaceAll(/("?)translate\1(\s*:\s*)"(kalic0re\.[^"]*)"/) { all, quote, colon, key ->
		if (key.contains('$(')) throw new GradleException("${where}: ${key} is built at run time, so it has no English to fall back on")
		def text = english[key]
		if (text == null) throw new GradleException("${where}: ${key} has no English in lang/en_us.json")
		usedEnglish << key
		"${all},${quote}fallback${quote}${colon}${quoted.toJson(text)}"
	}
}
tasks.named('processResources') {
	inputs.files(packLangs)
	exclude 'resourcepacks/*/lang/**'
	filteringCharset = 'UTF-8'
	doFirst { usedEnglish.clear() }
	// By where each file lands: filesMatching tests the path in its source, which for the generated dialogs
	// lacks resourcepacks/.
	eachFile { details ->
		if (!(details.path ==~ /resourcepacks\/[^\/]+\/data\/.+\.(mcfunction|json)/)) return
		def english = englishOf[details.path.split('/')[1]]
		def where = details.path
		details.filter { String line -> withFallbacks(line, english, where) }
	}
	doLast {
		packLangs.each { lang ->
			def unused = (new groovy.json.JsonSlurper().parse(lang, 'UTF-8') as Map).keySet() - usedEnglish
			if (unused) logger.warn("${lang}: English that no pack text uses: ${unused.sort().join(', ')}")
		}
	}
}

// Zips each built-in pack to build/datapacks/<pack>.zip for a world's datapacks/ folder. Reads
// processResources' output so pack.mcmeta arrives expanded.
def datapackZips = (file('src/main/resources/resourcepacks').listFiles()?.findAll { it.directory } ?: [])
	.collect { pack ->
		tasks.register("datapackZip${pack.name.capitalize()}", Zip) {
			dependsOn tasks.named('processResources')
			from layout.buildDirectory.dir("resources/main/resourcepacks/${pack.name}")
			archiveFileName = "${pack.name}.zip"
			destinationDirectory = layout.buildDirectory.dir('datapacks')
		}
	}

tasks.register('datapackZip') {
	group = 'build'
	description = 'Zips each built-in pack under resourcepacks/ into build/datapacks/.'
	dependsOn datapackZips
}
