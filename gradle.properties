org.gradle.jvmargs=-Xmx2G
org.gradle.parallel=true

# IntelliJ IDEA is not yet fully compatible with configuration cache, see: https://github.com/FabricMC/fabric-loom/issues/1349
org.gradle.configuration-cache=false

# Fabric Properties
# check these on https://fabricmc.net/develop
# Minecraft ships deobfuscated since 26.1, so there is no mappings artifact.
minecraft_version=26.2
fabric_loader_version=0.19.3
fabric_version=0.157.0+26.2
loom_version=1.17.19
shadow_version=9.6.1
polymer_version=0.17.3+26.2

# Java toolchain — read by build.gradle and fabric.mod.json. One place to bump.
java_version=25


# Mod Properties
mod_version = 0.14.0
mod_name = Kalic0re
mod_description = Shared library of Fabric/Polymer helpers for the Rainbow Kitty Club mods. Compile-time only: consumers shade the packages they use.
mod_authors = ["Kalic0"]
mod_website = https://github.com/RainbowKittyClub/Kalic0re
mod_issues = https://github.com/RainbowKittyClub/Kalic0re/issues
mod_license = CC0-1.0


# Never installed, never run: consumers relocate the common/ packages in. Makes the shared
# build.gradle declare fabric-api and Polymer compileOnly, so no consumer inherits a runtime
# claim this jar cannot honour.
library_only=true


# Project Properties
maven_group = club.rainbowkitty.kalic0re
mod_id = kalic0re
